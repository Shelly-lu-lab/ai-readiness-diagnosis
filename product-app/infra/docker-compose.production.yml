services:
  api:
    build:
      context: ..
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4310
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      DATA_LINK_SECRET: ${DATA_LINK_SECRET:?DATA_LINK_SECRET is required}
      INVITE_SECRET: ${INVITE_SECRET:?INVITE_SECRET is required}
      INTERNAL_WORKER_SECRET: ${INTERNAL_WORKER_SECRET:?INTERNAL_WORKER_SECRET is required}
      AUTH_MODE: ${AUTH_MODE:-email_otp}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:?EMAIL_PROVIDER is required}
      EMAIL_API_KEY: ${EMAIL_API_KEY:?EMAIL_API_KEY is required}
      EMAIL_API_URL: ${EMAIL_API_URL:?EMAIL_API_URL is required}
      EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM is required}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_REDIRECT_URI: ${FEISHU_REDIRECT_URI:-}
      FEISHU_BOOTSTRAP_OWNER_OPEN_IDS: ${FEISHU_BOOTSTRAP_OWNER_OPEN_IDS:-}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:?OBJECT_STORAGE_ENDPOINT is required}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-auto}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-true}
      OBJECT_STORAGE_SSE: ${OBJECT_STORAGE_SSE:-AES256}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4310/ready"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    build:
      context: ..
      target: worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      INTERNAL_API_URL: http://api:4310
      INTERNAL_WORKER_SECRET: ${INTERNAL_WORKER_SECRET:?INTERNAL_WORKER_SECRET is required}
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ..
      target: web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
