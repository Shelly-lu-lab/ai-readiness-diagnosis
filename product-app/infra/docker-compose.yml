services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_readiness
      POSTGRES_USER: ai_readiness
      POSTGRES_PASSWORD: local_only_change_me
    ports: ["54329:5432"]
    volumes: ["ai_readiness_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6389:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["ai_readiness_redis:/data"]
volumes:
  ai_readiness_pg:
  ai_readiness_redis:
